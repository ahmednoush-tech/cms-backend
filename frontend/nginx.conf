server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DEFAULT CONFIG — plain HTTP, used by the Dockerfile out of
    # the box for local testing (no domain/SSL certificate needed;
    # a real Docker run confirmed the earlier HTTPS-by-default
    # setup refused to even start without one, which blocked local
    # testing entirely). For a real deployment with a domain, see
    # nginx.conf.template + init-letsencrypt.sh, and change the
    # Dockerfile's COPY line to:
    #   COPY nginx.conf.template /etc/nginx/templates/default.conf.template

    # Reverse proxy to the backend container — the "backend" host
    # name below is the service name from docker-compose.yml, only
    # resolvable inside that compose network.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — this is a client-side-routed React app
    # (react-router). Any path not matching a real static file
    # must still serve index.html so the client-side router can
    # take over; without this, refreshing on e.g. /finance/invoices
    # would 404 at the Nginx layer before React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
